{% extends 'base.html' %}{% block content %}<p class="eyebrow">Progress by set</p><h1>{{ name }}</h1><section class="list">{% for row in rows %}<div class="history-row"><strong class="history-date">{{ row.completed_display }}</strong><span class="history-detail">{{ row.workout_name }} · Set {{ row.position }}: {{ row.reps }} reps × {{ row.weight }} kg</span></div>{% else %}<p>No completed sets yet.</p>{% endfor %}</section>{% endblock %}
