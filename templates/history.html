{% extends 'base.html' %}{% block content %}<p class="eyebrow">Every completed session</p><h1>History</h1><h2>Exercise history</h2><section class="list">{% for item in exercise_names %}<a href="{{ url_for('exercise_history', name=item.name) }}"><strong>{{ item.name }}</strong><span>View sets</span></a>{% endfor %}</section><h2>Workouts</h2><section class="list">{% for w in workouts %}<a href="{{ url_for('workout', workout_id=w.id) }}"><strong>{{ w.name }}</strong><span>{{ w.completed_display }}</span></a>{% endfor %}</section>{% endblock %}
